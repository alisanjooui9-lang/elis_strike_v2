<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ELIS STRIKE</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:#eaf2ff;font-family:Tahoma,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;z-index:2;display:none}
#hp{left:14px;bottom:max(14px,env(safe-area-inset-bottom));width:170px;font-size:12px}
#hpb{height:9px;background:#0008;border:1px solid #fff5;margin-top:3px;transform:skewX(-20deg)}#hpf{height:100%;width:100%;background:#2ecc71}
#sc{left:50%;transform:translateX(-50%);top:8px;background:#000a;padding:4px 14px;border-radius:6px;font-size:13px;white-space:nowrap}
#feed{right:12px;top:8px;font-size:11px;text-align:right;direction:rtl;max-width:36vw;text-shadow:0 1px 2px #000;line-height:1.5}
#ammo{left:200px;bottom:24px;font-size:26px;font-weight:bold;text-shadow:0 1px 3px #000;pointer-events:auto;padding:6px;text-align:center}#mm{inset:auto;left:12px;top:46px;width:110px;height:110px;border:1px solid #fff6;background:#0009;border-radius:6px;pointer-events:auto}#mm.big{left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vh,320px);height:min(88vh,320px)}#tmh{left:12px;top:164px;font-size:11px;line-height:1.7;text-shadow:0 1px 2px #000;text-align:right}#wd{inset:0;opacity:0;background:repeating-conic-gradient(#fff5 0 .5deg,#0000 .5deg 7deg);-webkit-mask:radial-gradient(circle,#0000 30%,#000 75%);mask:radial-gradient(circle,#0000 30%,#000 75%)}
#xh{left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fffc;border-radius:50%}
#hm{left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid #ff3b3b;transform:rotate(45deg);opacity:0}
#vg{inset:0;background:radial-gradient(transparent 45%,#d00000cc);opacity:0}
#scp{z-index:1;inset:0;opacity:0}#scp svg{width:100%;height:100%}.nv .m{padding:8px;font-size:13px;margin:4px 0}
#msg{left:50%;top:26%;transform:translateX(-50%);font-size:20px;text-shadow:0 2px 6px #000;text-align:center}
#base{display:none;width:100px;height:100px;border-radius:50%;border:2px solid #fff5;background:#ffffff14;z-index:3}
#knob{width:44px;height:44px;margin:28px;border-radius:50%;background:#ff7a00cc}
.b{position:fixed;z-index:3;border-radius:50%;background:#101a2cc0;border:2px solid #ff7a00;color:#fff;font:12px Tahoma,sans-serif;touch-action:none;display:none}
#ed{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:5;display:none;gap:8px;align-items:center;background:#000c;padding:6px 10px;border-radius:10px;font-size:12px}
#ed button{padding:6px 12px;border:0;border-radius:6px;background:#ff7a00;color:#fff;font:12px Tahoma}
#rot{position:fixed;inset:0;z-index:99;background:#05070b;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;line-height:2}
@media(orientation:portrait){#rot{display:flex}}
#menu{position:fixed;inset:0;z-index:10;background:linear-gradient(#04060aaa,#0000 35%,#0000 65%,#04060acc);display:flex;align-items:center;justify-content:center;overflow:auto}
.card{width:min(96vw,900px);max-height:96vh;overflow:auto;padding:16px;background:#0b1422d8;border:1px solid #ff7a0066;border-radius:12px;text-align:center;box-sizing:border-box}
.card.lobc{background:none;border:0;width:100vw;max-width:none;max-height:100vh;padding:8px 14px}
.nar{width:min(94vw,500px)}
.lob{display:grid;grid-template-columns:.85fr 1.3fr .95fr;gap:12px;align-items:start}
.lob2{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:12px;align-items:start}
.pn{background:#0b1422cc;border:1px solid #ff7a0055;border-radius:12px;padding:10px;max-height:90vh;overflow:auto;text-align:right}
.ctr{display:flex;flex-direction:column;justify-content:space-between;height:88vh}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:7px 10px;border:1px solid #ff7a0088;border-radius:8px;background:#1a2b45;color:#fff;font:12px Tahoma}.chips .on{background:#ff7a00}
h1{margin:0;font-size:34px;letter-spacing:3px}h1 span{color:#ff7a00}
p{color:#b4c6e0;font-size:13px;line-height:1.8;margin:6px 0 10px}
button.m,.row button{display:block;width:100%;margin:6px 0;padding:11px;border:0;border-radius:8px;background:#ff7a00;color:#fff;font:15px Tahoma,sans-serif}
button.g{background:#1a2b45!important}button:disabled{opacity:.4}
.two{display:flex;gap:6px;flex-wrap:wrap}.two button{margin:4px 0;width:auto;flex:1;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #ffffff18;font-size:13px;text-align:right}
.row button{width:auto;margin:0;padding:7px 12px;font-size:13px}
.xp{height:8px;background:#fff2;border-radius:4px;overflow:hidden;margin:6px 0}.xp i{display:block;height:100%;background:#ff7a00}
h3{margin:10px 0 4px;font-size:14px;color:#ff7a00}input[type=range]{width:100%;touch-action:auto}
</style>
<link rel="stylesheet" href="css/lobby.css">
<link rel="stylesheet" href="css/wheel.css">
<link rel="stylesheet" href="css/loadout.css">
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hp"><span id="hpt"></span><div id="hpb"><div id="hpf"></div></div></div>
<div class="hud" id="sc"></div><div class="hud" id="feed"></div><div class="hud" id="ammo"></div>
<div class="hud" id="xh"></div><div class="hud" id="hm"></div><div class="hud" id="vg"></div><div class="hud" id="scp"></div><div class="hud" id="msg"></div><div class="hud" id="wd"></div><canvas class="hud" id="mm" width="260" height="260"></canvas><div class="hud" id="tmh"></div>
<div class="hud" id="base"><div id="knob"></div></div>
<button class="b" id="bF" style="right:20px;bottom:22px;width:84px;height:84px;font-size:15px">شلیک</button>
<button class="b" id="bJ" style="right:118px;bottom:18px;width:58px;height:58px">پرش</button>
<button class="b" id="bS" style="right:118px;bottom:82px;width:58px;height:58px">لیز</button>
<button class="b" id="bR" style="right:22px;bottom:116px;width:54px;height:54px">ریلود</button>
<button class="b" id="bA" style="right:22px;bottom:178px;width:54px;height:54px">نشانه</button>
<button class="b" id="bW" style="right:88px;bottom:148px;width:66px;height:66px;font-size:10px">برداشتن</button>
<button class="b" id="bX" style="left:12px;top:8px;width:50px;height:32px;border-radius:8px">خروج</button>
<div id="ed"><span>اندازه</span><input type="range" id="bsz" min=".7" max="1.5" step=".05" style="width:110px" oninput="S.set.bs=+this.value;applyLay()"><button onclick="S.set.lay={};S.set.bs=1;$('bsz').value=1;applyLay()">ریست</button><button onclick="endEdit()">ذخیره</button><small>دکمه‌ها را بکش</small></div>
<div id="rot">📱<br>گوشی را افقی بگیر<br><small>(برای بازی لازم است)</small></div>
<div id="menu"><div class="card" id="mv"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Game code, loaded in this exact order (later files use things defined in earlier ones) -->
<script src="js/core.js"></script>
<script src="js/scene.js"></script>
<script src="js/models.js"></script>
<script src="js/game.js"></script>
<script src="js/backdrop.js"></script>
<script src="js/missions.js"></script>
<script src="js/lobby-ui.js"></script>
<script src="js/wheel.js"></script>
<script src="js/loadout.js"></script>
<script src="js/lobby.js"></script>
</body>
</html>
